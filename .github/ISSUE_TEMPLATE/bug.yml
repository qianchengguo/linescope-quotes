name: Bug report
description: Report a reproducible error using synthetic or redacted input
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and synthetic text/candidate JSON. Never include private quotations, secrets or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain the evidence and expected rule. A valid quote is not necessarily a semantically correct field.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, project commit, Ollama/model version if used
    validations:
      required: true
